- aid: investbamboo-com:investbamboo-com-us-stock-trading-api
  name: Bamboo Invest US Stock Trading API
  description: >-
    Users can buy and sell US securities, with support for multiple order types and fractional shares.
    Understanding order calculations, execution timing, and fees is crucial for integration.

    ### Trading Fundamentals

    - **Fractional Shares:** Users can buy/sell portions of expensive stocks (e.g., 0.1 shares of a $3,000
    stock), with minimum investment of $1 today. *Note* that fractional shares are supported for only
    MARKET orders to enable portfolio diversification for users with smaller capital.

    - **Market Hours and Execution:** Bamboo supports trading during US Stock extended hours, allowing
    users to place trades during pre and post market sessions alongside the regular trading hours. Orders
    placed outside trading hours wait for market to open and no active session on US market holidays,
    but users are able to still send in their trade requests.

    - **Settlement and Cash Impact:** Trades settle T+1; i.e., trade date + 1 business days. Buy orders
    immediately reduce buying power, sale proceeds appear as unsettled cash immediately and become withdrawable
    after T+1, while failed orders return funds to buying power instantly.


    <table>
      <thead>
        <tr>
          <th>Order Types</th>
          <th>Behaviours</th>
          <th>Use Cases</th>
          <th>Risks</th>
          <th>Duration</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Market</td>
          <td>Execute immediately at current market price</td>
          <td>When speed of execution matters more than exact price</td>
          <td>Price may move between order submission and execution</td>
          <td>Immediately during market open</td>
        </tr>
        <tr>
          <td>Limit</td>
          <td>Execute only at specified price</td>
          <td>`Buy` at specific price below current market or `SELL` at a price higher than market price</td>
          <td>May never execute if price doesn't reach limit</td>
          <td>Good Till Canceled (GTC) or specific expiration date (default OF 90 days)</td>
        </tr>
        <tr>
          <td>Stop</td>
          <td>Execute when stock reaches trigger price</td>
          <td>`Buy` at specific price above current market or `SELL` at a price lower than market price</td>
          <td>May never execute if price doesn't reach the set price</td>
          <td>Good Till Canceled (GTC) or specific expiration date (default OF 90 days)</td>
        </tr>
      </tbody>
    </table>


    **NB:** Trading fees apply to all order types, are deducted from the user’s cash balance (upfront
    for buy orders, from proceeds for sell orders), and vary based on partnership agreements; use the
    <a href="#tag/US-Stock-Trading/operation/Web.Api.OrderController.calculate_market_order"> calculate
    order endpoint </a> to determine exact fees before <a href="#tag/US-Stock-Trading/operation/Web.Api.OrderController.place_market_order">
    order placement</a>.
  humanURL: https://docs.investbamboo.com/
  baseURL: https://api.investbamboo.com
  tags:
  - US Stock Trading
  properties:
  - type: OpenAPI
    url: openapi/investbamboo-com-us-stock-trading-api-openapi.yml
  - type: Documentation
    url: https://docs.investbamboo.com/
- aid: investbamboo-com:investbamboo-com-withdrawals-api
  name: Bamboo Invest Withdrawals API
  description: >-
    Withdrawals allow users to extract funds from their brokerage accounts after successful trades. Understanding
    the settlement timeline is essential.


    #### Settlement Timeline

    - Stock sale proceeds settle at T+1 business day.

    - `unsettled_cash` indicates funds that are pending settlement.

    - Once settled, funds move to `withdrawal_cash` and become available for withdrawal.


    Remember that cash represents total funds in the user's brokerage account from all sources—deposits,
    stock sales, cancelled and rejected trades. All cash components (`cash`, `unsettled_cash`, `withdrawal_cash`)
    are available under the <a href="#tag/Portfolio-Reporting/operation/Web.Api.PortfolioController.portfolio">Portfolio
    endpoint</a>.
  humanURL: https://docs.investbamboo.com/
  baseURL: https://api.investbamboo.com
  tags:
  - Withdrawals
  properties:
  - type: OpenAPI
    url: openapi/investbamboo-com-withdrawals-api-openapi.yml
  - type: Documentation
    url: https://docs.investbamboo.com/
