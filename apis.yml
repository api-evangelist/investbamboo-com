- aid: investbamboo-com:investbamboo-com-portfolio-reporting-api
  name: Bamboo Invest Portfolio Reporting API
  description: >-
    The user's portfolio provides comprehensive views of investment performance, cash positions, and account
    status. Understanding the different cash types and portfolio calculations is essential for presenting
    accurate information to users.


    ##### Key Portfolio Terms

    #### Cash Categories:

    - **cash:** Total cash in the user’s brokerage account available for investment (buying power). All
    funds from deposits, stock sales, and cancelled or rejected trades are credited here.

    - **unsettled_cash:** Funds from stock sale are accounted for here, pending when they settle into
    withdrawal_cash

    - **withdrawal_cash:** Settled cash available for withdrawal from a user brokerage account. (Funds
    settle here after successful stock sale)

    - **actual_value:** Total portfolio value—sum of US stock holdings, unsettled cash, and cash balance


    #### Performance Metrics:

    - **value:** Current total portfolio value

    - **value_change:** Dollar change from previous close

    - **value_percent_change:** Percentage change from previous close

    - **total_return:** Lifetime gains/losses across all investments

    - **total_invested:** Cumulative amount invested by user
  humanURL: https://docs.investbamboo.com/
  baseURL: https://api.investbamboo.com
  tags:
  - Portfolio Reporting
  properties:
  - type: OpenAPI
    url: openapi/investbamboo-com-portfolio-reporting-api-openapi.yml
  - type: Documentation
    url: https://docs.investbamboo.com/
