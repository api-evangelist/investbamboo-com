- aid: investbamboo-com:investbamboo-com-market-activity-api
  name: Bamboo Invest Market Activity API
  description: "The market activity section provides you with endpoints that return the opening and closing\
    \ times for markets we support, allowing you to check when market is open/closed. \n\nThis endpoint\
    \ supports **US Stock extended trading hours**, allowing users to place trades during pre-market and\
    \ post-market sessions in addition to regular market hours.\n\n**Response Fields**\n\n`market_session`\
    \ - Indicates which market session is currently open:\n  - `pre_market` - Pre-market session (4:00\
    \ AM to 9:30 AM ET)\n  - `core_market` - Regular market hours (9:30 AM - 4:00 PM ET)\n  - `post_market`\
    \ - Post-market session (4:00 PM to 8:00 PM ET)\n\nEach field returns a boolean value (true if that\
    \ session is currently open, false otherwise).\n\n`open_date` - Provides Unix timestamps for when\
    \ each market session opens on the current trading day.\n\n`market_session_timestamp` - Provides Unix\
    \ timestamps indicating when each market session opens for the current day."
  humanURL: https://docs.investbamboo.com/
