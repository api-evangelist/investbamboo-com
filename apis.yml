    url: openapi/investbamboo-com-account-management-api-openapi.yml
  - type: Documentation
    url: https://docs.investbamboo.com/
- aid: investbamboo-com:investbamboo-com-authentication-api
  name: Bamboo Invest Authentication API
  description: >-
    Before you start making requests, you’ll need to generate an access token. Every request to the API
    must be authenticated using access tokens and user context headers — this ensures secure and authorized
    access to your resources.


    Here are a few quick tips to help you integrate smoothly and keep your tokens active:
      - **x-client-token:** A tenant-level access token that expires after 24 hours. You can generate
    up to 3 tokens per hour.
    - **Refresh Strategy:** Generate a new token before the current one expires to keep your requests
    running without interruption.


    Each endpoint’s required headers are outlined throughout this documentation, so you always know what’s
    needed to make a successful call.
  humanURL: https://docs.investbamboo.com/
  baseURL: https://api.investbamboo.com
  tags:
  - Authentication
  properties:
  - type: OpenAPI
    url: openapi/investbamboo-com-authentication-api-openapi.yml
  - type: Documentation
    url: https://docs.investbamboo.com/
- aid: investbamboo-com:investbamboo-com-deposits-api
  name: Bamboo Invest Deposits API
  description: >-
    Deposits fund user brokerage accounts for stock purchases. All deposits require verification through
    your webhook endpoint before funds are credited.


    On the <a href="#tag/US-Stock-Portfolio/operation/Web.Api.PortfolioController.portfolio">Portfolio
    endpoint</a>, different cash fields serve specific purposes as explained below:

    <table>
      <thead>
        <tr>
          <th>Field</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>cash</th>
          <td>Total cash in the user's brokerage account available for investment (buying power). Includes
    deposits, stock sales, cancelled and rejected trades.</td>
        </tr>
        <tr>
          <th>unsettled_cash</th>
          <td>Funds from stock sales pending settlement; not yet available for withdrawal.</td>
        </tr>
        <tr>
          <th>withdrawal_cash</th>
          <td>Settled funds available for withdrawal from the user brokerage account.</td>
        </tr>
        <tr>
          <th>actual_value</th>
          <td>Total portfolio value, calculated as sum of US stock holdings, unsettled_cash, and cash
    balance.</td>
        </tr>
      </tbody>
    </table>


    **Note:** Your `withdrawal_cash` and `unsettled_cash` are components within your total cash balance.
    But those fields are used to specifically distinguish between cash settled/unsettled for withdrawal.
  humanURL: https://docs.investbamboo.com/
  baseURL: https://api.investbamboo.com
  tags:
  - Deposits
  properties:
  - type: OpenAPI
    url: openapi/investbamboo-com-deposits-api-openapi.yml
  - type: Documentation
    url: https://docs.investbamboo.com/
