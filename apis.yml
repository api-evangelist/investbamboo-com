apis:
- aid: investbamboo-com:investbamboo-com-account-management-api
  name: Bamboo Invest Account Management API
  description: >-
    Account creation enables users to invest on Bamboo. Ensure KYC has been completed and each user’s
    identity verified before creating a brokerage account.


    **Best Practice:** To avoid maintenance fees on inactive accounts, create and fund brokerage accounts
    **only when users initiate their first trade**. You may collect account details in advance but delay
    sending the request until they’re ready to buy.


    ##### Prerequisites

    - **Minimum Age:** 18 years (verified via government-issued ID)

    - **Compliance:** Must meet local investment regulations


    ##### Document Requirements

    <table>
      <thead>
        <tr>
          <th>Country</th>
          <th>Primary ID</th>
          <th>Image Requirements</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Nigeria</th>
          <td>BVN</td>
          <td>Passport photo</td>
        </tr>
        <tr>
          <th>Ghana</th>
          <td>National ID</td>
          <td>Front & back ID images</td>
        </tr>
        <tr>
          <th>South Africa</th>
          <td>National ID</td>
          <td>Front & back ID images</td>
        </tr>
      </tbody>
    </table>


    **Note:** Images must be in Base64 format. The `front_id_image` and `back_id_image` fields apply only
    to Ghana and South Africa.


    ##### Phone Number Format

    - Must be in international format (e.g., +2347083864023)

    - Country code must match user’s residence

    - Used for notifications and account security
  humanURL: https://docs.investbamboo.com/
  baseURL: https://api.investbamboo.com
  tags:
  - Account Management
  properties:
