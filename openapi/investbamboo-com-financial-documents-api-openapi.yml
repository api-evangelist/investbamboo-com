openapi: 3.2.0
info:
  title: Investbamboo Com Financial Documents API
  version: ''
  description: 'Operations tagged Financial Documents across 2 of this provider''s published API definitions: bamboo-openapi.json, bamboo-financial-documents-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://powered-by-bamboo-sandbox.investbamboo.com
tags:
- name: Financial Documents
  description: Access various financial documents required for user account management, tax reporting, and regulatory compliance through secure document retrieval endpoints.
paths:
  /api/document_list:
    get:
      tags:
      - Financial Documents
      summary: Fetch List of All Documents
      description: 'Document retrieval begins with obtaining available document lists filtered by document type for efficient access to specific document categories.


        **Document Type Parameters:**

        - confirms: Trade confirmation documents

        - statements: Monthly account statements

        - taxforms: Annual tax reporting documents


        Document metadata includes unique file keys for document retrieval, generation dates showing when documents were created, coverage periods indicating date ranges covered by each document, and file formats with all documents provided as PDF files.'
      operationId: Web.Api.Tenant.ExchangeRateController.exchange_rate
      parameters:
      - name: content-type
        in: header
        description: Acceptable content type
        example: application/json
        required: true
        schema:
          type: string
      - name: accept-language
        in: header
        description: Acceptable language; 'en' for English
        example: en
        required: true
        schema:
          type: string
      - name: x-client-token
        in: header
        description: API consumer token
        required: true
        schema:
          type: string
      - name: x-user-id
        in: header
        description: Required for user authentication
        required: true
        schema:
          type: string
      - name: x-subject-type
        in: header
        description: For user request -> 'tenant'.
        required: true
        schema:
          type: string
      - name: document_type
        in: query
        description: "Used to state the type of document you want to download; \n- ```confirms``` for Trade Confirmations\n- ```statements``` for Account Statement\n- ```taxforms``` for Tax Documents\n"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/USDocumentList'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFound'
    servers:
    - url: https://powered-by-bamboo-sandbox.investbamboo.com
  /api/document:
    get:
      tags:
      - Financial Documents
      summary: Fetch a Single Document
      description: 'This endpoint is used to access individual document download URLs using unique file key identifiers gotten from the `document_list` endpoint.


        Security features include expiring URLs where download links expire for security, IP restrictions limiting access to authorized requests, and user verification ensuring documents are only accessible by account owners.'
      operationId: Web.Api.Tenant.DocumentController.document
      parameters:
      - name: content-type
        in: header
        description: Acceptable content type
        example: application/json
        required: true
        schema:
          type: string
      - name: accept-language
        in: header
        description: Acceptable language; 'en' for English
        example: en
        required: true
        schema:
          type: string
      - name: x-client-token
        in: header
        description: API consumer token
        required: true
        schema:
          type: string
      - name: x-user-id
        in: header
        description: Required for user authentication
        required: true
        schema:
          type: string
      - name: x-subject-type
        in: header
        description: For user request -> 'tenant'.
        required: true
        schema:
          type: string
      - name: file_key
        in: query
        description: File key gotten from the document list
        required: true
        schema:
          type: string
        example: 2024081901
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/USDocuments'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFound'
    servers:
    - url: https://powered-by-bamboo-sandbox.investbamboo.com
components:
  schemas:
    ResourceNotFound:
      title: Resource not found
      required:
      - message
      type: object
      properties:
        message:
          type: string
          description: Resource not found (an incorrect url may have been used)
          example: Resource Not Found
      description: Error response for when the resource is not found within our data.
    USDocumentList:
      title: List of Documents by Document Type
      required:
      - documents
      type: object
      properties:
        documents:
          type: array
          description: List of Documents
          example:
          - name: Aug 30, 2024 Trade Confirm
            file_key: '2024083001'
          - name: Aug 29, 2024 Trade Confirm
            file_key: '2024082901'
          - name: Aug 28, 2024 Trade Confirm
            file_key: '2024082801'
          - name: Aug 27, 2024 Trade Confirm
            file_key: '2024082701'
          - name: Aug 26, 2024 Trade Confirm
            file_key: '2024082601'
          - name: Aug 23, 2024 Trade Confirm
            file_key: '2024082301'
          - name: Aug 19, 2024 Trade Confirm
            file_key: '2024081901'
          - name: Aug 16, 2024 Trade Confirm
            file_key: '2024081601'
          - name: Aug 14, 2024 Trade Confirm
            file_key: '2024081401'
    USDocuments:
      title: URL to download a Single Document
      required:
      - url
