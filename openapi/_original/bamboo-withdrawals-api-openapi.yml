info:
  title: Bamboo Withdrawals API
  version: ''
  description: Withdrawals allow users to extract funds from their brokerage accounts after successful trades.
servers:
- url: https://powered-by-bamboo-sandbox.investbamboo.com
tags:
- name: Withdrawals
  description: Withdrawals allow users to extract funds from their brokerage accounts after successful trades.
paths:
  /api/tenant_brokerage_withdraw:
    post:
      tags:
      - Withdrawals
      summary: Create Withdrawal
      description: 'Withdrawal requests follow a similar verification flow as deposits. You send a notification request with the necessary details to debit the user''s brokerage account, we verify that the user has the amount requested.

        Once verified, the specified amount is deducted from the user''s brokerage account, and withdrawal status events are sent via Google Pub/Sub.


        Offline settlement happens between our teams using established procedures. (see event details under withdrawal status events)'
      operationId: Web.Api.WithdrawController.tenant_brokerage_withdraw_ngn
      parameters:
      - name: content-type
        in: header
        description: Acceptable content type
        example: application/json
        required: true
        schema:
          type: string
      - name: accept-language
        in: header
        description: Acceptable language; 'en' for English
        example: en
        required: true
        schema:
          type: string
      - name: x-user-id
        in: header
        description: Required for user authentication
        required: true
        schema:
          type: string
      - name: x-subject-type
        in: header
        description: For user request -> 'tenant'.
        required: true
        schema:
          type: string
      - name: x-client-token
        in: header
        description: API Consumer Authorisation Token
        required: true
        schema:
          type: string
      requestBody:
        description: tenant withdraw body parameter for NGN
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantBrokerageWithdrawBody'
      responses:
        '200':
          description: Withdrawal requested
          content:
            application/json:
              schema:
                type: string
                description: No response body for this endpoint
                example: ''
        '401':
          description: Token has expired or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '422':
          description: Incomplete Parameters
          content:
            application/json:
              example:
                message: Error Message
              schema:
                $ref: '#/components/schemas/ErrorChangesetResponse'
      x-codegen-request-body-name: body
  /api/tenant/withdraws:
    get:
      tags:
      - Withdrawals
      summary: Fetch All Withdrawals
      description: Complete withdrawal history with date filtering
      parameters:
      - name: accept-language
        in: header
        description: Acceptable language; 'en' for English
        example: en
        required: true
        schema:
          type: string
      - name: x-user-id
        in: header
        description: Required for user authentication
