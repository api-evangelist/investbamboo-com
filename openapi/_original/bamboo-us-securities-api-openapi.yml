info:
  title: Bamboo US Securities API
  version: ''
  description: 'The section provides comprehensive information about available US stocks, including real-time pricing, company details, and market data.


    Stock themes also help users discover investment opportunities based on trends, sectors, and investment strategies. See the Featured Themes section for detailed information about theme-based stock discovery and categorization.'
servers:
- url: https://powered-by-bamboo-sandbox.investbamboo.com
tags:
- name: US Securities
  description: 'The section provides comprehensive information about available US stocks, including real-time pricing, company details, and market data.


    Stock themes also help users discover investment opportunities based on trends, sectors, and investment strategies. See the Featured Themes section for detailed information about theme-based stock discovery and categorization.'
paths:
  /api/stocks:
    get:
      tags:
      - US Securities
      summary: Fetch List of All Stocks
      description: 'This endpoint fetches the list of stocks with basic information about them like their symbol and logo for building stock catalogs and search functionality.


        **Stock catalog features include:**

        - **Basic information:** with symbol, company name, and logo imagery

        - **Pagination support:** for efficient loading of large stock universes

        - **Search integration:** providing foundation data for search functionality

        - **High-quality** company logos for UI integration


        Integration considerations include caching stock lists to reduce API calls, updating periodically for new stock additions, and using pagination for optimal performance.'
      operationId: Web.Api.StockController.index
      parameters:
      - name: x-user-id
        in: header
        description: Required for user authentication
        required: true
        schema:
          type: string
      - name: x-subject-type
        in: header
        description: For user request -> 'tenant'.
        required: true
        schema:
          type: string
      - name: x-client-token
        in: header
        description: API consumer token
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Number of requested results. (Default = 20)
        schema:
          type: string
      - name: next_token
        in: query
        description: Next token for pagination
        schema:
          type: integer
      responses:
        '200':
          description: Stock list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StocksListResponse'
        '401':
          description: Token have expired or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
  /api/tenant/stock/{symbol}/details:
    get:
      tags:
      - US Securities
      summary: Fetch Stock Details
      description: 'This endpoint returns comprehensive details of a specific stock, including its pricing information, designed to provide users with in-depth insight into the stock.


        **Comprehensive stock information includes:**

        - **Real-time pricing:** with current price, daily change, and percentage movement

        - **Market data:** showing volume, market cap, P/E ratio, and 52-week high/low

        - **Company information:** including business description, CEO, and sector classification

        - **Investment story:** with detailed analysis and investment thesis

        - **Dividend information:** showing yield and payment history

        - **Earnings data:** with historical earnings and upcoming dates


        **Enhanced features:**

        - Support multi-currency pricing requests in local currency

        - ich content with company stories and investment analysis

        - Visual assets including company logos and brand colors for UI theming

        - Market context with industry comparisons and sector performance

        - Indicates that extended hours trading is active for that particular stock.


        **Note:** We currently only support LIMIT orders and whole unit trading during extended hours.'
      operationId: Web.Api.StockDataController.details
      parameters:
      - name: content-type
        in: header
        description: Acceptable content type
        example: application/json
        required: true
        schema:
          type: string
      - name: accept-language
        in: header
        description: Acceptable language; 'en' for English
        example: en
        required: true
        schema:
          type: string
      - name: x-user-id
        in: header
        description: Required for user authentication
        required: true
        schema:
          type: string
      - name: x-subject-type
        in: header
        description: For user request -> 'tenant'.
        required: true
        schema:
          type: string
      - name: x-client-token
        in: header
        description: API consumer token
        required: true
        schema:
          type: string
      - name: x-request-source
        in: header
        description: The tenant's username
        required: true
        schema:
          type: string
      - name: currency
        in: header
        description: NGN - to order in Naira
        schema:
          type: string
      - name: symbol
        in: path
        description: Stock Symbol
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Stock pricing details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDetails'
        '401':
          description: Token have expired or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFound'
        '422':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/stock/search:
    get:
      tags:
      - US Securities
      summary: Search Stocks
      description: 'This endpoint searches for a stock by a given query phrase or set of phrases, supporting advanced search capabilities with multiple filtering and sorting options.


        The search functionality supports complex queries like filtering stocks between specific price ranges, performance thresholds, or market cap sizes, with predefined filters for top gainers, top losers, and user-owned stocks.


        ##### Advanced search capabilities include:


        **Query Options:**

        - **Text Search:** Query by company names, stock symbols, ticker matching

        - **Theme Filtering:** Filter by investment themes and categories

        - **Multi-Parameter:** Combine text search with theme filters


        **Sorting Options:**

        - **Alphabetical:** `alphabetical:asc` or `alphabetical:desc`

        - **Price-Based:** `price:asc`, `percent_change:asc`

        - **Fundamentals:** `market_cap:asc`, `pe_ratio:asc`, `eps:asc`

        - **Trading Metrics:** `volume:asc`, `div_yield:asc`


        **Advanced Filtering:**

        - **Price Ranges:** `price;a:10,price;b:50` (between $10-$50)

        - **Performance:** `percent_change;a:5` (gaining above 5%)

        - **Market Cap:** `market_cap;b:1000000000` (under $1B market cap)

        - **Fundamentals:** `pe_ratio;a:15` (P/E ratio above 15)

        - **Predefined Filters:** `top_gainers`, `top_losers`, `my_stocks`


        **Example Usage:**


        GET /api/stock/search?query=apple&sorting=market_cap:desc&filters=price;a:100,my_stocks'
      operationId: Web.Api.StockController.search
      parameters:
      - name: content-type
        in: header
        description: Acceptable content type
        example: application/json
        required: true
        schema:
          type: string
      - name: accept-language
        in: header
        description: Acceptable language; 'en' for English
        example: en
        required: true
        schema:
          type: string
      - name: x-user-id
        in: header
        description: Required for user authentication
        required: true
        schema:
          type: string
      - name: x-subject-type
        in: header
        description: For user request -> 'tenant'.
        required: true
        schema:
          type: string
      - name: x-client-token
        in: header
        description: API consumer token
        required: true
        schema:
          type: string
      - name: query
        in: query
        description: Query phrase to match stock name or symbol
        required: true
        schema:
          type: string
      - name: theme_id
        in: query
        description: Theme id to filter by. This takes only one value
        schema:
          type: string
      - name: sorting
        in: query
        description: 'Used to sort the search either by ascending order, descending order, etc. The acceptable values are stated in the description above.

          '
        example: alphabetical:asc
        schema:
          type: string
      - name: filters
        in: query
        description: 'Used to filter the search by providing certain string values separated by a comma. The expected values to be passed for the filters param are stated in the description above.

          '
        example: price;a:10, price;b:50
        schema:
          type: string
      responses:
        '200':
          description: Stock list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StocksSearchResponse'
        '401':
          description: Token have expired or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
  /api/my_stocks:
    get:
      tags:
      - US Securities
      summary: Fetch User Stock Ownership
      description: 'This endpoint is used to get the list of stocks a user owns, providing a complete view of their current investment positions.


        ##### User portfolio stocks include:

        - **Owned positions:** showing all stocks currently held by the user

        - **Position details:** with share quantities, current values, and performance metrics

        - **Equity breakdown:** showing individual stock contributions to total portfolio

        - **Multi-currency support:** displaying local currency values with exchange rates


        This endpoint supports portfolio management by tracking all user investments in one view, calculating portfolio diversity and concentration, monitoring individual position performance, and supporting portfolio rebalancing decisions.'
      operationId: Web.Api.StockDataController.ownership
      parameters:
      - name: content-type
        in: header
        description: Acceptable content type
        example: application/json
        required: true
        schema:
          type: string
      - name: accept-language
        in: header
        description: Acceptable language; 'en' for English
        example: en
        required: true
        schema:
          type: string
      - name: x-user-id
        in: header
        description: Required for user authentication
        required: true
        schema:
          type: string
      - name: x-subject-type
        in: header
        description: For user request -> 'tenant'.
        required: true
        schema:
          type: string
      - name: x-client-token
        in: header
        description: API consumer token
        required: true
        schema:
          type: string
      - name: x-request-source
        in: header
        description: The tenant's username
        required: true
        schema:
          type: string
      - name: currency
        in: header
        description: NGN - to order in Naira
        schema:
          type: string
      responses:
        '200':
          description: Stock pricing details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStockOwnership'
        '401':
          description: Token have expired or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFound'
        '422':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
